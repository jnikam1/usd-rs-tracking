name: probe
on: push
permissions:
  contents: write
jobs:
  live:
    if: ${{ !contains(github.event.head_commit.message, '[results]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test && npm run typecheck
      - run: npx next build
        env: { WISE_COMPARISON_PUBLIC: '1' }
      - name: Start and capture
        env: { WISE_COMPARISON_PUBLIC: '1', CRON_SECRET: probe-secret, ALERT_ABOVE: '94', ALERT_MOVE_PCT: '0.5' }
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          sleep 8
          mkdir -p out
          curl -sS localhost:3000/api/health > out/health.json
          curl -sS "localhost:3000/api/quotes?amount=1000" > out/quotes-1000.json
          curl -sS "localhost:3000/api/quotes?amount=100" > out/quotes-100.json
          curl -sS localhost:3000/api/rates > out/rates.json
          for r in 1d 7d 30d 1y; do curl -sS "localhost:3000/api/history?range=$r" | python3 -c "import json,sys; d=json.load(sys.stdin); print('$r', d.get('source'), len(d.get('points',[])), d.get('attempts'))"; done | tee out/history.txt
          curl -sS -o out/cron-noauth.json -w "noauth %{http_code}\n" "localhost:3000/api/cron/check?dry=1" | tee out/cron.txt
          curl -sS -o out/cron-dry.json -w "dry %{http_code}\n" -H "Authorization: Bearer probe-secret" "localhost:3000/api/cron/check?dry=1" | tee -a out/cron.txt
          curl -sS -o out/cron-real.json -w "real-no-topic %{http_code}\n" -H "Authorization: Bearer probe-secret" "localhost:3000/api/cron/check" | tee -a out/cron.txt
          set +e
          which google-chrome
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          for (const [name, vp, dsf, scheme] of [['desktop', { width: 1366, height: 900 }, 1, 'light'], ['mobile', { width: 375, height: 812 }, 2, 'light'], ['mobile-dark', { width: 375, height: 812 }, 2, 'dark']]) {
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: dsf, colorScheme: scheme });
            const pg = await ctx.newPage();
            const errs = [];
            pg.on('pageerror', (e) => errs.push(String(e)));
            pg.on('console', (m) => { if (m.type() === 'error') errs.push(m.text()); });
            await pg.goto('http://localhost:3000/', { waitUntil: 'networkidle' });
            await pg.waitForTimeout(2500);
            const sw = await pg.evaluate(() => document.documentElement.scrollWidth);
            console.log(name, 'scrollWidth', sw, 'errors', JSON.stringify(errs));
            await pg.screenshot({ path: `out/${name}-top.png` });
            await pg.screenshot({ path: `out/${name}-full.png`, fullPage: true });
            if (name === 'mobile') {
              const r = await pg.$('#results-title');
              await r.scrollIntoViewIfNeeded();
              await pg.evaluate(() => window.scrollBy(0, -80));
              await pg.waitForTimeout(300);
              await pg.screenshot({ path: `out/${name}-results.png` });
            }
            if (name === 'desktop') {
              await pg.click('.toggle input');
              await pg.click('button.chip:has-text("$10,000")');
              await pg.waitForTimeout(3500);
              await pg.screenshot({ path: `out/${name}-10000-welcome.png` });
              await pg.click('button.chip:has-text("$1,000")');
              await pg.waitForTimeout(3000);
              const t = await pg.$('#trends');
              await t.scrollIntoViewIfNeeded();
              await pg.waitForTimeout(800);
              await t.screenshot({ path: `out/${name}-trends.png` });
              await pg.evaluate(() => window.scrollTo(0, 0));
            }
            if (name !== 'mobile-dark') {
              await pg.click('.prow .actions button');
              await pg.waitForTimeout(500);
              await pg.screenshot({ path: `out/${name}-drawer.png` });
              await pg.keyboard.press('Escape');
            }
            await ctx.close();
          }
          await b.close();
          JS
          npm i --no-save playwright-core@1.55.0 2>&1 | tail -2
          node shot.mjs 2>&1 | tee out/browser.txt
          tail -30 server.log > out/server.log
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          rm -rf results && mv out results
          git add results && git commit -m "probe results [results]" && git push
