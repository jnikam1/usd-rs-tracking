name: Rate alerts

# Vercel's free plan only runs crons once a day, so this hourly ping drives the rate alerts.
# The endpoint dedupes through ntfy, so a late or repeated run never double notifies.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the alert check
        env:
          APP_URL: ${{ vars.APP_URL || 'https://usd-rs-tracking.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/check?mode=watch"
          else
            curl -fsS -m 60 "$APP_URL/api/cron/check?mode=watch"
          fi
